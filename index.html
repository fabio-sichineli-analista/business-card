<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fábio Sichineli - Cartão Virtual</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=boska@400,500,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --gold: #caa44a;
      --gold-strong: #e5c56f;
      --text: #f7f2e7;
      --muted: #c8c1b3;
      --border: rgba(202,164,74,.3 );
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow: 0 28px 70px rgba(0,0,0,.6), 0 12px 34px rgba(202,164,74,.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at top, rgba(202,164,74,.15), transparent 40%), #0a0a0a;
      color: var(--text);
      font-family: 'Satoshi', Arial, sans-serif;
    }

    .card {
      width: min(100%, 430px);
      min-height: 850px;
      position: relative;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      background: #111;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      text-align: center;
    }

    .brand img {
      width: 130px; /* Logo aumentada */
      height: auto;
      margin-bottom: 12px;
    }

    .brand-text strong {
      display: block;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .brand-text .slogan {
      display: block;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      color: var(--gold-strong); /* Slogan em destaque dourado */
      font-weight: 500;
      text-transform: uppercase;
    }

    .identity h1 {
      font-family: 'Boska', serif;
      font-size: 2.8rem;
      color: #fff;
      margin-top: 10px;
    }

    .role {
      font-size: 1.1rem;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .cta-grid {
      display: grid;
      gap: 12px;
      width: 100%;
    }

    .btn {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: var(--radius-md);
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(180deg, #e7cb7c 0%, #caa44a 100%);
      color: #17130a;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .impact-phrase {
      margin: 20px 0;
      font-size: 1.0rem;
      line-height: 1.5;
      color: var(--gold-strong);
      font-weight: 500; /* Negrito extra */
      padding: 15px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .bottom-panel {
      background: rgba(255,255,255,0.03);
      padding: 20px;
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .qr-box {
      width: 140px;
      height: 140px;
      background: #fff;
      padding: 10px;
      border-radius: 12px;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
    }

    .qr-copy strong {
      color: var(--gold);
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    .qr-copy p {
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="./assets/logo_precisao.png" alt="Logo Instituto Precisão">
      <div class="brand-text">
        <strong>Instituto Precisão</strong>
        <span class="slogan">Estrutura Técnica para Decisões de Alto Impacto</span>
      </div>
    </div>

    <div class="identity">
      <h1>Fábio Sichineli</h1>
      <p class="role">Arquiteto Estrutural do Pensamento</p>
    </div>

    <div class="cta-grid">
      <a href="https://wa.me/5547991820229" class="btn btn-primary"><i class="fab fa-whatsapp"></i> WhatsApp</a>
      <a href="mailto:contato@precisaoanalitica.com.br" class="btn btn-secondary"><i class="fas fa-envelope"></i> E-mail</a>
      <a href="https://www.linkedin.com/in/fabiosichineli" class="btn btn-secondary"><i class="fab fa-linkedin"></i> LinkedIn</a>
      <a href="https://www.instagram.com/institutoprecisao" class="btn btn-secondary"><i class="fab fa-instagram"></i> Instagram</a>
      <a href="https://precisaoanalitica.com.br" class="btn btn-secondary"><i class="fas fa-globe"></i> Site</a>
    </div>

    <div class="impact-phrase">
      "ESTRUTURAMOS O PENSAMENTO HUMANO SOB COMPLEXIDADE PARA DECISÕES QUE NÃO ADMITEM IMPROVISOS"
    </div>

    <div class="bottom-panel">
      <div class="qr-box">
        <img src="./assets/qrcode.png" alt="QR Code">
      </div>
      <div class="qr-copy">
        <strong>Acesso rápido</strong>
        <p>Escaneie para salvar o contato</p>
      </div>
    </div>
  </main>
</body>
</html>
