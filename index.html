<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fábio Sichineli - Cartão de Visitas Virtual</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #D4AF37;
            --black: #000000;
            --dark-gray: #1a1a1a;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--white);
            overflow-x: hidden;
        }

        .card-container {
            width: 350px;
            height: 550px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
            border-radius: 15px;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            border: 2px solid var(--gold);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* Frente do Cartão */
        .logo-section img {
            width: 120px;
            margin-bottom: 10px;
        }

        .name-section h1 {
            color: var(--gold);
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .name-section p {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ccc;
        }

        .quote-section {
            margin: 20px 0;
            font-style: italic;
            border-left: 2px solid var(--gold);
            padding-left: 15px;
            text-align: left;
        }

        .quote-section p {
            font-size: 1rem;
            line-height: 1.4;
        }

        .contact-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--black);
            background-color: var(--gold);
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            transform: scale(1.02);
            background-color: #f1c40f;
        }

        .btn i {
            font-size: 1.2rem;
        }

        /* Verso do Cartão */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .service-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .service-item img {
            width: 45px;
            height: 45px;
        }

        .service-item span {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold);
        }

        .qr-section {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .qr-section img {
            width: 140px;
            border: 3px solid var(--gold);
            border-radius: 10px;
        }

        .qr-section p {
            font-size: 0.8rem;
            color: #aaa;
        }

        .footer-text {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #888;
            margin-top: 20px;
        }

        .flip-hint {
            position: fixed;
            bottom: 20px;
            color: var(--gold);
            font-size: 0.9rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>

    <div class="card-container" id="card">
        <div class="card-inner">
            <!-- FRENTE -->
            <div class="card-front">
                <div class="logo-section">
                    <img src="assets/logo_precisao.png" alt="Instituto Precisão Logo">
                </div>
                
                <div class="name-section">
                    <h1>Fábio Sichineli</h1>
                    <p>Analista de Decisão Estratégica</p>
                </div>

                <div class="quote-section">
                    <p>"Sem método,<br>decisão é só opinião."</p>
                </div>

                <div class="contact-buttons">
                    <a href="https://wa.me/5547991820229" class="btn" onclick="event.stopPropagation()">
                        <i class="fab fa-whatsapp"></i> WhatsApp
                    </a>
                    <a href="mailto:contato@precisaoanalitica.com.br" class="btn" onclick="event.stopPropagation()">
                        <i class="fas fa-envelope"></i> E-mail
                    </a>
                    <a href="https://www.linkedin.com/in/fabiosichineli" target="_blank" class="btn" onclick="event.stopPropagation()">
                        <i class="fab fa-linkedin"></i> LinkedIn
                    </a>
                    <a href="https://www.instagram.com/institutoprecisao" target="_blank" class="btn" onclick="event.stopPropagation()">
                        <i class="fab fa-instagram"></i> Instagram
                    </a>
                </div>
            </div>

            <!-- VERSO -->
            <div class="card-back">
                <div class="services-grid">
                    <div class="service-item">
                        <img src="assets/icon_analise.png" alt="Análise">
                        <span>Análise</span>
                    </div>
                    <div class="service-item">
                        <img src="assets/icon_estrategia.png" alt="Estratégia">
                        <span>Estratégia</span>
                    </div>
                    <div class="service-item">
                        <img src="assets/icon_decisao.png" alt="Decisão">
                        <span>Decisão</span>
                    </div>
                    <div class="service-item">
                        <img src="assets/icon_resultado.png" alt="Resultado">
                        <span>Resultado</span>
                    </div>
                </div>

                <div class="qr-section">
                    <img src="assets/qrcode.png" alt="QR Code">
                    <p>Escaneie para salvar o contato</p>
                </div>

                <div class="footer-text">
                    ESTRUTURANDO DECISÕES COMPLEXAS.
                </div>
            </div>
        </div>
    </div>

    <div class="flip-hint">Toque para virar o cartão</div>

    <script>
        const card = document.getElementById('card');
        card.addEventListener('click', () => {
            card.classList.toggle('flipped');
        });
    </script>
</body>
</html>
